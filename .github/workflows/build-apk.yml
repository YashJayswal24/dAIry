name: Build APK

# Builds a debug APK on every push to master and publishes it as a rolling
# "latest" GitHub Release, so there's always one stable, directly
# downloadable link to the newest build. Also uploaded as a workflow
# artifact for convenience while looking at a specific run.
#
# This is a debug build (self-signed with the default debug keystore) --
# fine for installing on a device to test, not set up for Play Store
# distribution. It also does NOT bundle the Gemma/embedding model files
# (see docs/RUNNING_ON_DEVICE.md) -- those still need to be pushed to the
# device separately after installing.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dairy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatically built from commit `${{ github.sha }}` on `${{ github.ref_name }}`.

            Debug build, self-signed with the default debug keystore -- for
            development/testing only. Does not include the Gemma or
            embedding model files; see docs/RUNNING_ON_DEVICE.md to push
            those after installing.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
