name: Unit Tests

# Dedicated test-visibility workflow: runs the unit test suite on every
# push and on pull requests, and publishes results as a GitHub Check with
# per-test pass/fail annotations (not just a pass/fail on the whole job).
#
# build-apk.yml also runs the same tests as a gate before publishing a
# release -- that's deliberate, not redundant: this workflow is about
# *visibility* (clear annotations, PR checks, works on branches/PRs too),
# build-apk.yml's copy is about *not shipping a broken build*. The second
# run costs almost nothing thanks to Gradle's build cache.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Publish test report (per-test pass/fail annotations)
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'app/build/test-results/testDebugUnitTest/*.xml'
          detailed_summary: true

      - name: Upload full HTML test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
